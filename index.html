<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間分配助手</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <h2 id="welcome">載入中...</h2>
    <p>請選擇當前任務：</p>
    <button onclick="sendTime('工作')">💻 工作</button>
    <button onclick="sendTime('休息')">☕ 休息</button>

    <script>
        async function main() {
            // 初始化 LIFF，填入你在後台申請的 LIFF ID
            await liff.init({ liffId: "2008804901-1rsNMJIO" }); 
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                document.getElementById('welcome').innerText = "嗨, " + profile.displayName;
                // 在你的程式碼第 21 行之後加入以下內容：
                if (!liff.getScope().includes('chat_message.write')) {
                   alert('偵測到缺少發送訊息權限，請重新點擊連結並同意授權！');
                }
            } else {
                liff.login(); // 引導登入
            }
        }
        async function sendTime(task) { // 加上 async
            // 把結果傳回 LINE 對話框
            try {
                // 加上 await 確保訊息真的發出去了
                await liff.sendMessages([{
                    type: 'text',
                    text: "我開始進行：" + task
                }]);
                alert('紀錄成功！'); // 加個警示視窗確認程式有跑到這
                liff.closeWindow(); 
            } catch (error) {
                alert('發送失敗: ' + error.message); // 如果失敗，會跳出錯誤原因
            }
        }
        main();
    </script>
</body>
</html>
