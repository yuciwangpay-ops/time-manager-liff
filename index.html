<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間紀錄助手</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        /* 填空式句子的樣式 */
        .sentence-container {
            font-size: 20px;
            font-weight: bold;
            color: #444;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 讓輸入框看起來像文字的一部分 */
        input#duration {
            width: 70px;
            height: 40px;
            font-size: 22px;
            font-weight: bold;
            color: #00B900;
            /* LINE 綠 */
            text-align: center;
            border: none;
            border-bottom: 3px solid #00B900;
            background: transparent;
            outline: none;
        }

        /* .guide-text {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        } */

        /* 按鈕網格系統 */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }

        button {
            height: 55px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        /* 點擊時的縮放回饋 */
        button:active {
            transform: scale(0.92);
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.1);
        }

        /* 精緻的顏色配置 */
        .btn-study {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-work {
            background: linear-gradient(135deg, #2c3e50 0%, #4ca1af 100%);
        }

        .btn-exercise {
            background: linear-gradient(135deg, #6cc15f 0%, #1a6d2c 100%);
        }

        .btn-housework {
            background: linear-gradient(135deg, #5ee7df 0%, #b490ca 100%);
        }

        .btn-play {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
        }

        /* 社交 (粉紅溫暖) */
        .btn-social {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        }

        /* 交通 (淺灰藍 - 穩定流動感) */
        .btn-transport {
            background: linear-gradient(135deg, #6aa0f5 0%, #c2e9fb 100%);
        }

        /* 放空 (淺紫/雲朵感 - 夢幻空靈) */
        .btn-zoning-out {
            background: linear-gradient(135deg, #d2b7eb 0%, #b516dc 100%);
        }

        /* 睡眠 (深藍/星空感 - 深度修復) */
        .btn-sleep {
            background: linear-gradient(135deg, #09203f 0%, #537895 100%);
        }
    </style>
</head>

<body>
    <h2 id="welcome">載入中...</h2>

    <div class="sentence-container">
        <span>剛剛的</span>
        <input type="number" id="duration" value="30">
        <span>分鐘做了.....</span>
    </div>

    <!-- <p class="guide-text">做了.....</p> -->

    <div class="btn-grid">
        <button class="btn-social" onclick="sendTime('社交')">🤝 社交</button>
        <button class="btn-play" onclick="sendTime('娛樂')">🎮 娛樂</button>

        <button class="btn-exercise" onclick="sendTime('激烈運動')">🏋️ 激烈運動</button>
        <button class="btn-exercise" onclick="sendTime('和緩運動')">🧘 和緩運動</button>

        <button class="btn-transport" onclick="sendTime('交通')">🚗 交通</button>
        <button class="btn-housework" onclick="sendTime('家務')">🧹 家務</button>

        <button class="btn-study" onclick="sendTime('學習')">📚 學習</button>
        <button class="btn-work" onclick="sendTime('工作')">💻 工作</button>

        <button class="btn-zoning-out" onclick="sendTime('放空')">😶‍🌫️ 放空</button>
        <button class="btn-sleep" onclick="sendTime('睡眠')">😴 睡眠</button>
    </div>

    <script>
        async function main() {
            // 初始化 LIFF，填入你在後台申請的 LIFF ID
            await liff.init({ liffId: "2008804901-1rsNMJIO" });
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                document.getElementById('welcome').innerText = "嗨, " + profile.displayName;
                // 在你的程式碼第 21 行之後加入以下內容：
                if (!liff.getScope().includes('chat_message.write')) {
                    alert('偵測到缺少發送訊息權限，請重新點擊連結並同意授權！');
                }
            } else {
                liff.login(); // 引導登入
            }
        }

        /////////////////////////
        // ... 前面的 main() 函式保持不變 ...
        async function sendTime(task) {
            const durationInput = document.getElementById('duration');
            const duration = durationInput.value;

            if (!duration || duration <= 0) {
                alert("請輸入有效的時間喔！");
                return;
            }

            try {
                const profile = await liff.getProfile();
                document.body.style.opacity = "0.5";
                const response = await fetch("https://script.google.com/macros/s/AKfycbwUEkZU7mP3A5PFyDO7uvcQm5Eil7JbECe_Sj1kcDR7LS6nwAu7fXhps55tIKOzja5B/exec", {
                    method: "POST",
                    //mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        userName: profile.displayName,
                        userId: profile.userId,
                        task: task,
                        duration: duration
                    })
                });
                // 3. 成功後關閉視窗
                alert('紀錄成功！資料已存入。');
                if (response.ok) {
                    liff.closeWindow();
                }
            } catch (error) {
                alert('紀錄失敗：' + error);
                document.body.style.opacity = "1";
            }
        }
        main();
    </script>
</body>

</html>
